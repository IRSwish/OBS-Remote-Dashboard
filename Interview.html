<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Interview Console</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/lucide-static/font/lucide.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg: #080808;
      --panel: #0e0e0e;
      --accent: #C9A84C;
      --accent2: #8B6010;
      --glass: rgba(201,168,76,0.06);
    }
    body {
      background: linear-gradient(180deg, #0a0a0a, #050505);
      color: #e8dfc8;
    }
    .panel {
      border: 1px solid rgba(201,168,76,0.18);
      background: #0e0e0e;
    }
    .panel h3 {
      color: #C9A84C;
      letter-spacing: 0.08em;
      font-size: 13px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .chat-header button,
    .icon-btn {
      background: linear-gradient(90deg, #C9A84C, #8B6010);
      color: #080808;
    }
    .chat-header input {
      border-color: rgba(201,168,76,0.25);
      color: #e8dfc8;
    }
    .preview-controls input {
      border-color: rgba(201,168,76,0.25);
      background: #111;
      color: #e8dfc8;
    }
    .main { transition: grid-template-columns 0.35s ease; }
    #chatPanel {
      overflow: hidden;
      min-width: 0;
      transition: opacity 0.35s ease;
    }
    #chatPanel.chat-hidden {
      opacity: 0;
      pointer-events: none;
    }
    /* 5 cams : 3 en haut, 2 en bas (centrees) */
    #previewContainer {
      flex-wrap: wrap;
      align-content: stretch;
      justify-content: center;
    }
    #previewContainer .preview-wrapper {
      flex: 0 1 calc(33.333% - 4px);
      min-width: 0;
    }
    .preview-wrapper {
      border: 1px solid rgba(201,168,76,0.12);
      overflow: hidden;
      transition: flex 0.35s ease, opacity 0.35s ease;
    }
    .preview-wrapper.cam-hidden {
      flex: 0 !important;
      opacity: 0;
      border: none !important;
    }
    .panel-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .panel-title-row h3 { margin-bottom: 0; flex: 1; }
    .header-btn {
      padding: 3px 10px;
      border-radius: 6px;
      border: 1px solid rgba(201,168,76,0.3);
      background: transparent;
      color: #C9A84C;
      cursor: pointer;
      font-size: 11px;
      letter-spacing: 0.04em;
    }
    .header-btn:hover { background: rgba(201,168,76,0.1); }
    .header-btn.cam-off {
      background: rgba(201,168,76,0.15);
      border-color: rgba(201,168,76,0.6);
      text-decoration: line-through;
      opacity: 0.5;
    }

    /* ---------- MOBILE / TABLETTE ----------
       Le dashboard est pense pour un ecran large : une colonne de cams + le chat
       a cote, le tout cale sur la hauteur de la fenetre. Sur telephone ca donne
       des vignettes minuscules et des controles intouchables, donc en dessous de
       1024px on repasse en colonne unique et on laisse la page defiler. */
    @media (max-width: 1024px) {
      body { height: auto; min-height: 100vh; }
      /* !important : .main porte un style inline, reecrit en plus par le bouton
         « Cacher le chat » — sans ca le chat garderait sa colonne de 360px */
      .main {
        grid-template-columns: 1fr !important;
        grid-auto-rows: min-content;
      }
      #previewPanel { min-height: 0; }
      #previewContainer {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        /* sans ca les lignes s'etirent sur la hauteur du panneau et les vignettes
           ne tiennent plus leur 16/9 */
        align-content: start;
        flex: none;
      }
      /* un <input> a une largeur minimale intrinseque (~20 caracteres) : sans
         min-width:0 il ne retrecit pas et pousse les boutons hors du cadre */
      .preview-controls input,
      .chat-header input { min-width: 0; }
      #previewContainer .preview-wrapper {
        flex: none;
        aspect-ratio: 16 / 9;
      }
      /* en grille, le flex:0 de .cam-hidden ne masque plus rien */
      .preview-wrapper.cam-hidden { display: none; }
      #chatPanel.chat-hidden { display: none; }
      #chatFrame { flex: none; height: 55vh; min-height: 300px; }
      .panel-title-row { flex-wrap: wrap; }
      .panel-title-row h3 { flex: 1 0 100%; }
    }

    @media (max-width: 640px) {
      /* une cam par ligne : en dessous, les controles se chevauchent */
      #previewContainer { grid-template-columns: 1fr; }
      /* cibles tactiles + police a 16px (sinon iOS zoome au focus) */
      .preview-controls {
        background: rgba(0,0,0,0.55);
        border-radius: 8px;
        padding: 6px;
        gap: 8px;
      }
      .preview-controls input,
      .chat-header input,
      .chat-header button { font-size: 16px; padding: 8px; }
      .icon-btn { width: 38px; height: 38px; flex: none; }
      .preview-controls .icon-btn svg { width: 20px; height: 20px; }
      .header-btn { padding: 8px 12px; font-size: 13px; }
      .main { padding: 8px; gap: 8px; }
      .panel { padding: 10px; }
    }
  </style>
</head>
<body>
  <div class="main" style="grid-template-columns:1fr 360px;">
    <div style="display:flex; flex-direction:column; gap:12px; flex:1;">
      <div class="panel" id="previewPanel">
        <div class="panel-title-row">
          <h3>Cameras</h3>
          <button class="header-btn cam-toggle-btn" data-index="0">Cam 1</button>
          <button class="header-btn cam-toggle-btn" data-index="1">Cam 2</button>
          <button class="header-btn cam-toggle-btn" data-index="2">Cam 3</button>
          <button class="header-btn cam-toggle-btn" data-index="3">Cam 4</button>
          <button class="header-btn cam-toggle-btn" data-index="4">Cam 5</button>
          <button class="header-btn" id="toggleChat">Cacher le chat</button>
        </div>
        <div id="previewContainer">
          <div class="preview-wrapper">
            <div class="preview-controls"></div>
            <iframe id="preview1" src=""></iframe>
          </div>
          <div class="preview-wrapper">
            <div class="preview-controls"></div>
            <iframe id="preview2" src=""></iframe>
          </div>
          <div class="preview-wrapper">
            <div class="preview-controls"></div>
            <iframe id="preview3" src=""></iframe>
          </div>
          <div class="preview-wrapper">
            <div class="preview-controls"></div>
            <iframe id="preview4" src=""></iframe>
          </div>
          <div class="preview-wrapper">
            <div class="preview-controls"></div>
            <iframe id="preview5" src=""></iframe>
          </div>
        </div>
      </div>
    </div>

    <div class="panel" id="chatPanel">
      <h3>Chat</h3>
      <div class="chat-header">
        <input type="text" id="chatChannel" placeholder="Twitch channel" value="Rainbow6FR"/>
        <button id="loadChat">Load Chat</button>
      </div>
      <div id="chatFrame" class="chat-iframe"></div>
    </div>
  </div>
  
  <script src="https://embed.twitch.tv/embed/v1.js"></script>
  </div>

  <script type="module" src="js/main.js"></script>
  <script>
    document.getElementById("toggleChat").addEventListener("click", function() {
      const chat = document.getElementById("chatPanel");
      const main = document.querySelector(".main");
      const hiding = !chat.classList.contains("chat-hidden");
      chat.classList.toggle("chat-hidden", hiding);
      main.style.gridTemplateColumns = hiding ? "1fr 0px" : "1fr 360px";
      this.textContent = hiding ? "Afficher le chat" : "Cacher le chat";
    });

    document.querySelectorAll(".cam-toggle-btn").forEach(btn => {
      btn.addEventListener("click", function() {
        const idx = parseInt(this.dataset.index);
        const wrappers = document.querySelectorAll(".preview-wrapper");
        const wrapper = wrappers[idx];
        const hiding = !wrapper.classList.contains("cam-hidden");
        wrapper.classList.toggle("cam-hidden", hiding);
        this.classList.toggle("cam-off", hiding);
      });
    });
  </script>
</body>
</html>
