<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Interview Console</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/lucide-static/font/lucide.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg: #080808;
      --panel: #0e0e0e;
      --accent: #C9A84C;
      --accent2: #8B6010;
      --glass: rgba(201,168,76,0.06);
    }
    body {
      background: linear-gradient(180deg, #0a0a0a, #050505);
      color: #e8dfc8;
    }
    .panel {
      border: 1px solid rgba(201,168,76,0.18);
      background: #0e0e0e;
    }
    .panel h3 {
      color: #C9A84C;
      letter-spacing: 0.08em;
      font-size: 13px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .chat-header button,
    .icon-btn {
      background: linear-gradient(90deg, #C9A84C, #8B6010);
      color: #080808;
    }
    .chat-header input {
      border-color: rgba(201,168,76,0.25);
      color: #e8dfc8;
    }
    .preview-controls input {
      border-color: rgba(201,168,76,0.25);
      background: #111;
      color: #e8dfc8;
    }
    .main { transition: grid-template-columns 0.35s ease; }
    #chatPanel {
      overflow: hidden;
      min-width: 0;
      transition: opacity 0.35s ease;
    }
    #chatPanel.chat-hidden {
      opacity: 0;
      pointer-events: none;
    }
    .preview-wrapper {
      border: 1px solid rgba(201,168,76,0.12);
      overflow: hidden;
      transition: flex 0.35s ease, opacity 0.35s ease;
    }
    .preview-wrapper.cam-hidden {
      flex: 0 !important;
      opacity: 0;
      border: none !important;
    }
    .panel-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .panel-title-row h3 { margin-bottom: 0; flex: 1; }
    .header-btn {
      padding: 3px 10px;
      border-radius: 6px;
      border: 1px solid rgba(201,168,76,0.3);
      background: transparent;
      color: #C9A84C;
      cursor: pointer;
      font-size: 11px;
      letter-spacing: 0.04em;
    }
    .header-btn:hover { background: rgba(201,168,76,0.1); }
    .header-btn.cam-off {
      background: rgba(201,168,76,0.15);
      border-color: rgba(201,168,76,0.6);
      text-decoration: line-through;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="main" style="grid-template-columns:1fr 360px;">
    <div style="display:flex; flex-direction:column; gap:12px; flex:1;">
      <div class="panel" id="previewPanel">
        <div class="panel-title-row">
          <h3>Cameras</h3>
          <button class="header-btn cam-toggle-btn" data-index="0">Cam 1</button>
          <button class="header-btn cam-toggle-btn" data-index="1">Cam 2</button>
          <button class="header-btn cam-toggle-btn" data-index="2">Cam 3</button>
          <button class="header-btn" id="toggleChat">Cacher le chat</button>
        </div>
        <div id="previewContainer">
          <div class="preview-wrapper">
            <div class="preview-controls"></div>
            <iframe id="preview1" src=""></iframe>
          </div>
          <div class="preview-wrapper">
            <div class="preview-controls"></div>
            <iframe id="preview2" src=""></iframe>
          </div>
          <div class="preview-wrapper">
            <div class="preview-controls"></div>
            <iframe id="preview3" src=""></iframe>
          </div>
        </div>
      </div>
    </div>

    <div class="panel" id="chatPanel">
      <h3>Chat</h3>
      <div class="chat-header">
        <input type="text" id="chatChannel" placeholder="Twitch channel" value="Rainbow6FR"/>
        <button id="loadChat">Load Chat</button>
      </div>
      <div id="chatFrame" class="chat-iframe"></div>
    </div>
  </div>
  
  <script src="https://embed.twitch.tv/embed/v1.js"></script>
  </div>

  <script type="module" src="js/main.js"></script>
  <script>
    document.getElementById("toggleChat").addEventListener("click", function() {
      const chat = document.getElementById("chatPanel");
      const main = document.querySelector(".main");
      const hiding = !chat.classList.contains("chat-hidden");
      chat.classList.toggle("chat-hidden", hiding);
      main.style.gridTemplateColumns = hiding ? "1fr 0px" : "1fr 360px";
      this.textContent = hiding ? "Afficher le chat" : "Cacher le chat";
    });

    document.querySelectorAll(".cam-toggle-btn").forEach(btn => {
      btn.addEventListener("click", function() {
        const idx = parseInt(this.dataset.index);
        const wrappers = document.querySelectorAll(".preview-wrapper");
        const wrapper = wrappers[idx];
        const hiding = !wrapper.classList.contains("cam-hidden");
        wrapper.classList.toggle("cam-hidden", hiding);
        this.classList.toggle("cam-off", hiding);
      });
    });
  </script>
</body>
</html>
